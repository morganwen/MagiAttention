[mypy]
# "extensions" is an import root of its own so that magi_attn_extensions.DSA is
# resolved as a top-level package rather than extensions.magi_attn_extensions.DSA.
mypy_path = .:extensions
# Optionals
no_implicit_optional = True

# Strictness
allow_untyped_globals = False
allow_redefinition = True
implicit_reexport = False
strict_equality = True

# FIXME(xiaowu): Need to fix this
warn_return_any = False
# Warnings
warn_unused_ignores = False
warn_no_return = True
warn_redundant_casts = True
warn_unreachable = True

# Error output
show_column_numbers = True
show_error_context = True
show_error_codes = True
show_traceback = True
pretty = True
color_output = True
error_summary = True

[mypy-colors]
ignore_missing_imports = True

[mypy-pytest]
ignore_missing_imports = True

[mypy-magi_attention.magi_attn_ext]
ignore_errors = True

[mypy-polib]
ignore_missing_imports = True
